<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Sdnbet365 | المنصة الرياضية</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#17253b;--line:#263750;--text:#f3f6fb;--muted:#a6b4c8;--green:#20c783;--gold:#f4c15d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -20%,#1a3652 0,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);background:#0b1220ef;position:sticky;top:0;z-index:5}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--green),#087d65);color:#061b17}
.brand span{color:var(--green)}
.navlinks,.auth-actions,.wallet-actions,.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.navlinks a{color:var(--muted);text-decoration:none;padding:10px;font-size:14px}
.wallet{display:flex;align-items:center;gap:12px}
.balance{font-size:12px;color:var(--muted)}
.balance strong{display:block;color:white;font-size:15px;margin-top:3px}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800}
.primary{background:var(--green);color:#06251b}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.hero{padding:30px 0 24px;display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
.hero-copy,.hero-card{border:1px solid var(--line);border-radius:22px;padding:28px;background:linear-gradient(145deg,#14233a,#101a2b)}
.eyebrow{color:var(--green);font-weight:800}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.35}
.hero p,.tile p,.section-head p,.modal-card p{color:var(--muted);line-height:1.9}
.hero-card{background:linear-gradient(145deg,#173e39,#132b36);display:flex;flex-direction:column;justify-content:space-between;min-height:230px}
.big{font-size:36px;font-weight:900;color:var(--gold);margin:18px 0}
.tag{display:inline-block;border-radius:7px;padding:5px 8px;background:#20364b;color:#cfe2f3;font-size:11px}
.notice{border:1px solid #6e592b;background:#2b2517;color:#f2dca5;border-radius:12px;padding:13px;font-size:12px;line-height:1.8;margin-top:15px}
.section{padding:22px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.section h2{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile,.match{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px}
.tile h3{margin:13px 0 7px}
.emoji{font-size:28px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.team{text-align:center;font-weight:700}
.vs{color:var(--muted);font-size:12px}
.odds{display:flex;gap:7px;grid-column:1/-1}
.odd{flex:1;background:var(--panel2);border:1px solid var(--line);color:white;border-radius:9px;padding:10px 5px}
.odd small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.odd b{color:var(--gold)}
.wallet-actions{margin-top:14px}
.footer{border-top:1px solid var(--line);margin-top:30px;padding:25px 0;color:var(--muted);font-size:12px;line-height:1.9}
.chat-launch{position:fixed;bottom:20px;left:20px;z-index:10;background:var(--green);color:#06251b;border:0;border-radius:999px;padding:14px 18px;font-weight:900}
.chatbox{position:fixed;left:20px;bottom:82px;width:min(360px,calc(100vw - 40px));z-index:11;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;display:none}
.chatbox.open{display:block}
.chathead{padding:15px;background:#173a35;display:flex;justify-content:space-between}
.chathead small{display:block
