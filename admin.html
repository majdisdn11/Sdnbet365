
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>SDNBet365 | لوحة الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#263750;--text:#f3f6fb;--muted:#a6b4c8;--green:#20c783;--gold:#f4c15d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
main{max-width:1050px;margin:30px auto;padding:16px}
header,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1,h2{margin-top:0}
p{color:var(--muted);line-height:1.8}
input,button{font:inherit;border-radius:9px;padding:12px;margin:5px 0}
input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line)}
button{border:0;background:var(--green);color:#06251b;font-weight:bold;cursor:pointer}
button.secondary{background:#263750;color:white}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.status{font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--gold)}
.hidden{display:none}
.notice{border:1px solid #6e592b;background:#2b2517;padding:12px;border-radius:10px;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<main>
<header>
<h1>SDNBet365 — لوحة الإدارة</h1>
<p>إدارة طلبات المحفظة · اتصال مباشر بقاعدة Supabase</p>
<div class="notice">هذه اللوحة لا تنفّذ تحويلات مالية. لا تعتمد أي طلب أو تغيّر رصيدًا حتى يتم إعداد إجراءات خلفية آمنة.</div>
</header>

<section class="card" id="loginPanel">
<h2>دخول المسؤول</h2>
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
<div class="row">
<button id="loginButton">تسجيل الدخول</button>
</div>
<div id="loginStatus" class="status" role="status"></div>
</section>

<section class="card hidden" id="dashboard">
<div class="row">
<div><h2>طلبات المحفظة</h2><p id="adminInfo"></p></div>
<div style="text-align:left"><button class="secondary" id="refreshButton">تحديث</button> <button class="secondary" id="logoutButton">خروج</button></div>
</div>
<div id="dashboardStatus" class="status" role="status"></div>
<div class="table-wrap">
<table>
<thead><tr><th>رقم الطلب</th><th>معرّف اللاعب</th><th>النوع</th><th>المبلغ</th><th>طريقة الدفع</th><th>الحالة</th><th>التاريخ</th></tr></thead>
<tbody id="requestsBody"></tbody>
</table>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL="https://bjzowejwvhicgmphkwkk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_O5rsM4bPYTpU09g0ZSuohw_uBasP2mj";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const loginPanel=document.getElementById("loginPanel");
const dashboard=document.getElementById("dashboard");
const loginStatus=document.getElementById("loginStatus");
const dashboardStatus=document.getElementById("dashboardStatus");
const requestsBody=document.getElementById("requestsBody");
let busy=false;

function setBusy(value){
 busy=value;
 document.getElementById("loginButton").disabled=value;
 document.getElementById("refreshButton").disabled=value;
}
function showMessage(el,message){el.textContent=message;}

async function verifyAdmin(){
 const {data:{user},error}=await db.auth.getUser();
 if(error||!user)return false;
 const {data,error:adminError}=await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",user.id)
  .maybeSingle();
 if(adminError)throw adminError;
 return Boolean(data);
}

async function renderRequests(){
 dashboardStatus.textContent="جارٍ تحميل الطلبات...";
 requestsBody.replaceChildren();

 const {data,error}=await db
  .from("wallet_requests")
  .select("id,user_id,request_type,amount,payment_method,status,created_at")
  .order("created_at",{ascending:false})
  .limit(100);

 if(error)throw error;
 if(!data||data.length===0){
  dashboardStatus.textContent="لا توجد طلبات ظاهرة، أو أن سياسات قاعدة البيانات لا تسمح بعرضها.";
  return;
 }

 for(const request of data){
  const tr=document.createElement("tr");
  const values=[
   request.id,request.user_id,request.request_type,
   String(request.amount)+" د.ت",request.payment_method||"—",
   request.status,new Date(request.created_at).toLocaleString("ar-TN")
  ];
  for(const value of values){
   const td=document.createElement("td");
   td.textContent=String(value??"—");
   tr.appendChild(td);
  }
  requestsBody.appendChild(tr);
 }
 dashboardStatus.textContent="تم تحميل "+data.length+" طلبًا. العرض فقط؛ لا يتم اعتماد الطلبات أو تعديل الأرصدة.";
}

async function openDashboard(){
 setBusy(true);
 try{
  const {data:{user}}=await db.auth.getUser();
  if(!user){
   loginPanel.classList.remove("hidden");
   dashboard.classList.add("hidden");
   return;
  }
  const allowed=await verifyAdmin();
  if(!allowed){
   await db.auth.signOut();
   loginPanel.classList.remove("hidden");
   dashboard.classList.add("hidden");
   showMessage(loginStatus,"هذا الحساب غير مسجل في قائمة المسؤولين. لم يتم منح صلاحية الإدارة.");
   return;
  }
  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  document.getElementById("adminInfo").textContent="المسؤول: "+user.email;
  await renderRequests();
 }catch(error){
  showMessage(dashboardStatus,"تعذر تحميل اللوحة: "+(error.message||"خطأ غير معروف"));
 }finally{
  setBusy(false);
 }
}

document.getElementById("loginButton").addEventListener("click",async()=>{
 if(busy)return;
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){showMessage(loginStatus,"أدخل البريد الإلكتروني وكلمة المرور.");return;}
 setBusy(true);
 showMessage(loginStatus,"جارٍ تسجيل الدخول والتحقق من صلاحية الإدارة...");
 try{
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;
  await openDashboard();
 }catch(error){
  showMessage(loginStatus,"تعذر تسجيل الدخول: "+(error.message||"خطأ غير معروف"));
 }finally{setBusy(false);}
});

document.getElementById("refreshButton").addEventListener("click",async()=>{
 if(busy)return;
 setBusy(true);
 try{
  if(!await verifyAdmin())throw new Error("تعذر التحقق من صلاحية الإدارة.");
  await renderRequests();
 }catch(error){
  showMessage(dashboardStatus,error.message||"تعذر تحديث الطلبات.");
 }finally{setBusy(false);}
});

document.getElementById("logoutButton").addEventListener("click",async()=>{
 await db.auth.signOut();
 dashboard.classList.add("hidden");
 loginPanel.classList.remove("hidden");
 showMessage(loginStatus,"تم تسجيل الخروج.");
});

db.auth.onAuthStateChange(()=>{});
</script>
</body>
</html>
